# Karma's failed traitor prototype implanters for admemes

- type: entity
  parent: BaseSubdermalImplant
  id: BlueSpaceStorageImplant
  name: bluespace storage implant
  description: This implant grants hidden storage within a person's body using bluespace technology.
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      implantAction: ActionOpenBlueSpaceStorageImplant
      whitelist:
        components:
          - Hands # no use giving a mouse a storage implant, but a monkey is another story...
    - type: Storage
      grid:
        - 0,0,19,9
      storageInsertSound: /Audio/Effects/Lightning/lightningbolt.ogg
      storageRemoveSound: /Audio/Effects/Lightning/lightningbolt.ogg
    - type: ContainerContainer
      containers:
        storagebase: !type:Container
          ents: [ ]
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface
