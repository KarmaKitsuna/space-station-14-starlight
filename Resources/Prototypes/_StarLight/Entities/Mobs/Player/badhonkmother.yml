- type: entity
  abstract: true
  id: MobBadHonkmotherBase
  name: Bad Honkmother
  description: Insert funny pun here
  components:
    - type: Sprite
      drawdepth: Ghosts
      layers:
        - state: badhonkmother
          shader: unshaded
          sprite: _Starlight/Mobs/Demons/badhonkmother.rsi
          map: [ "normalLayer" ]
          visible: true
        - state: transform
          shader: unshaded
          sprite: _Starlight/Mobs/Demons/honkmotherv2.rsi
          map: [ "enum.AnimateOnSpawnVisualLayers.Animation" ]
          visible: false
    - type: GenericVisualizer
      visuals:
        enum.AnimateOnSpawnVisualState.Animating:
          normalLayer:
            True: { visible: false }
            False: { visible: true }
    - type: AnimationPlayer

- type: entity
  parent: [MobBadHonkmotherBase, BaseMob, MobPolymorphable, MobCombat, BaseAnomaly]
  id: BadHonkmother
  components:
    - type: MobPrice
      price: -100000 # Pay someone to take her
    - type: ContentEye
      maxZoom: 2.0,2.0
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.40
          density: 100
          mask:
            - FlyingMobMask
    - type: MobState
    - type: Input
      context: "human"
    - type: MovementIgnoreGravity
    - type: IntrinsicRadioReceiver
    - type: ActiveRadio
      channels:
      - Binary
      - Common
      - Command
      - CentCom
      - Engineering
      - Medical
      - Science
      - Security
      - Service
      - Supply
      - Syndicate
      globalReceive: true
    - type: Physics
      bodyType: KinematicController
      bodyStatus: InAir
    - type: CanMoveInAir
    - type: HTN
      rootTask:
        task: SimpleRangedHostileCompound
    - type: BatteryAmmoProvider
      proto: RedLaser
      fireCost: 62.5
    - type: PredictedBattery
      maxCharge: 1000
      startingCharge: 1000
    - type: PredictedBatterySelfRecharger
      autoRechargeRate: 40
    - type: Gun
      fireRate: 2
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      soundGunshot: /Audio/Weapons/Guns/Gunshots/laser_clown.ogg
    - type: NpcFactionMember
      factions:
        - HonkHostile
    - type: Speech
      speechVerb: Cluwne
    - type: CombatMode
    - type: InnateTool
      tools:
        - id: WeaponBehonkerLaser
        - id: BikeHorn
    - type: UserInterface
      interfaces:
        enum.StrippingUiKey.Key:
          type: StrippableBoundUserInterface
    - type: MeleeWeapon
      range: 7 
      soundHit:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
      animation: WeaponArcThrust
      damage:
        types:
          Piercing: 10
          Slash: 10
          Structural: 250

- type: entity
  parent: BadHonkmother
  suffix: transform
  id: BadHonkmotherTransform
  components:
  - type: Sprite
    drawdepth: Ghosts
    layers:
      - state: badhonkmother
        shader: unshaded
        sprite: _Starlight/Mobs/Demons/badhonkmother.rsi
        map: [ "normalLayer" ]
        visible: false
      - state: transform
        shader: unshaded
        sprite: _Starlight/Mobs/Demons/honkmotherv2.rsi
        map: [ "enum.AnimateOnSpawnVisualLayers.Animation" ]
        visible: true
  - type: GenericVisualizer
    visuals:
      enum.AnimateOnSpawnVisualState.Animating:
        normalLayer:
          True: { visible: false }
          False: { visible: true }
  - type: AnimateOnSpawn
