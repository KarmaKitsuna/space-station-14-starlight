- type: entity
  abstract: true
  id: MobBadHonkmotherBase
  name: Bad Honkmother
  description: Insert funny pun here
  components:
    - type: Sprite
      drawdepth: Ghosts
      layers:
        - state: badhonkmother
          shader: unshaded
          sprite: _Starlight/Mobs/Demons/badhonkmother.rsi
          map: [ "normalLayer" ]
          visible: true
        - state: transform
          shader: unshaded
          sprite: _Starlight/Mobs/Demons/honkmotherv2.rsi
          map: [ "enum.AnimateOnSpawnVisualLayers.Animation" ]
          visible: false
    - type: GenericVisualizer
      visuals:
        enum.AnimateOnSpawnVisualState.Animating:
          normalLayer:
            True: { visible: false }
            False: { visible: true }
    - type: AnimationPlayer

- type: entity
  parent: [MobBadHonkmotherBase, BaseMob, MobPolymorphable, MobCombat]
  id: BadHonkmother
  components:
  - type: MobPrice
    price: -10000 # Pay someone to take her
  - type: ContentEye
    maxZoom: 2.0,2.0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.40
        density: 100
        mask:
          - FlyingMobMask
  - type: MobState
  - type: Input
    context: "human"
  - type: MovementIgnoreGravity
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    channels:
    - Binary
    - Common
    - Command
    - CentCom
    - Engineering
    - Medical
    - Science
    - Security
    - Service
    - Supply
    - Syndicate
    globalReceive: true
  - type: Physics
    bodyType: KinematicController
    bodyStatus: InAir
  - type: CanMoveInAir
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: HitscanBatteryAmmoProvider
    proto: RedLaser
    fireCost: 62.5
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 40
  - type: Gun
    fireRate: 0.75
    useKey: false
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/laser_clown.ogg
  - type: Speech
  - type: CombatMode
  - type: InnateTool
    tools:
      - id: WeaponBehonkerLaser
      - id: BikeHorn
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: MeleeWeapon
    range: 7 
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    animation: WeaponArcThrust
    damage:
      types:
        Piercing: 10
        Slash: 10
