- type: entity
  parent: BadHonkmother
  suffix: transform
  id: BadHonkmotherTransform
  components:
  - type: Sprite
    drawdepth: Ghosts
    layers:
      - state: badhonkmother
        shader: unshaded
        sprite: _Starlight/Mobs/Demons/badhonkmother.rsi
        map: [ "normalLayer" ]
        visible: false
      - state: transform
        shader: unshaded
        sprite: _Starlight/Mobs/Demons/honkmotherv2.rsi
        map: [ "enum.AnimateOnSpawnVisualLayers.Animation" ]
        visible: true
  - type: GenericVisualizer
    visuals:
      enum.AnimateOnSpawnVisualState.Animating:
        normalLayer:
          True: { visible: false }
          False: { visible: true }
  - type: AnimateOnSpawn
